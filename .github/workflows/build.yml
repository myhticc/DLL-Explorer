name: Build and test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run native tests
        shell: pwsh
        run: ./build.ps1 -Tests -Analyze
      - name: Run report and command-line regression tests
        shell: pwsh
        run: ./tests/integration_tests.ps1
